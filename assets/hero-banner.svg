<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="synapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#ai-bg)" rx="16"/>
  <!-- Neural Synapse Connections -->
  <g stroke="url(#synapse)" stroke-width="2" opacity="0.6">
    <line x1="180" y1="140" x2="360" y2="200" />
    <line x1="180" y1="270" x2="360" y2="200" />
    <line x1="180" y1="400" x2="360" y2="340" />
    <line x1="360" y1="200" x2="560" y2="270" />
    <line x1="360" y1="340" x2="560" y2="270" />
    <line x1="560" y1="270" x2="780" y2="180" />
    <line x1="560" y1="270" x2="780" y2="360" />
  </g>
  <!-- Node Circles -->
  <circle cx="180" cy="140" r="14" fill="#a855f7"/>
  <circle cx="180" cy="270" r="14" fill="#6366f1"/>
  <circle cx="180" cy="400" r="14" fill="#06b6d4"/>
  <circle cx="360" cy="200" r="18" fill="#8b5cf6"/>
  <circle cx="360" cy="340" r="18" fill="#3b82f6"/>
  <circle cx="560" cy="270" r="26" fill="#a855f7" opacity="0.9"/>
  <circle cx="780" cy="180" r="14" fill="#06b6d4"/>
  <circle cx="780" cy="360" r="14" fill="#10b981"/>
  <!-- Central Glass Floating Matrix -->
  <rect x="420" y="380" width="380" height="95" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5"/>
  <text x="445" y="418" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">AI TRANSFORMER PIPELINE</text>
  <text x="445" y="452" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Zero-Latency In-Browser Neural Core</text>
</svg>